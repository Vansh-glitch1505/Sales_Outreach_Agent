<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="720" fill="#ffffff"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Sales Outreach Agent — LangGraph Pipeline</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#64748b">per-lead flow · runs once for every row in the leads CSV</text>

  <!-- research -->
  <rect x="330" y="90" width="240" height="72" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">research</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#1e40af">Gemini 2.5 Flash</text>
  <text x="450" y="153" text-anchor="middle" font-size="12" fill="#1e40af">web_search · fetch_company_website</text>

  <line x1="450" y1="162" x2="450" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- copywriter -->
  <rect x="330" y="198" width="240" height="72" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="450" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">copywriter</text>
  <text x="450" y="246" text-anchor="middle" font-size="12" fill="#166534">Gemini 2.5 Flash</text>
  <text x="450" y="261" text-anchor="middle" font-size="12" fill="#166534">drafts SUBJECT + BODY</text>

  <line x1="450" y1="270" x2="450" y2="304" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- checks -->
  <rect x="300" y="306" width="300" height="86" rx="14" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="450" y="332" text-anchor="middle" font-size="16" font-weight="700" fill="#713f12">checks</text>
  <text x="450" y="352" text-anchor="middle" font-size="12" fill="#854d0e">Groq · openai/gpt-oss-20b</text>
  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#854d0e">spam · personalization · tone</text>
  <text x="450" y="384" text-anchor="middle" font-size="12" fill="#854d0e">each scored 0–100</text>

  <line x1="450" y1="392" x2="450" y2="426" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- score_gate -->
  <rect x="330" y="428" width="240" height="72" rx="14" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="450" y="456" text-anchor="middle" font-size="16" font-weight="700" fill="#831843">score_gate</text>
  <text x="450" y="476" text-anchor="middle" font-size="12" fill="#9d174d">all checks ≥ 70?</text>
  <text x="450" y="491" text-anchor="middle" font-size="12" fill="#9d174d">max 2 revisions</text>

  <!-- loop back to copywriter -->
  <path d="M 330,464 C 150,464 150,234 328,234" fill="none" stroke="#db2777" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="150" y="350" text-anchor="middle" font-size="12" fill="#9d174d" transform="rotate(-90 150 350)">revise · feedback → copywriter</text>

  <!-- branches -->
  <line x1="400" y1="500" x2="260" y2="560" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="500" x2="640" y2="560" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- flagged -->
  <rect x="120" y="562" width="220" height="70" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="230" y="592" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">flagged</text>
  <text x="230" y="612" text-anchor="middle" font-size="12" fill="#991b1b">manual review queue</text>

  <!-- approved -->
  <rect x="560" y="562" width="220" height="70" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="670" y="592" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">approved</text>
  <text x="670" y="612" text-anchor="middle" font-size="12" fill="#047857">added to outbox</text>

  <!-- footer note -->
  <line x1="450" y1="80" x2="450" y2="80" stroke="none"/>
  <text x="450" y="668" text-anchor="middle" font-size="12" fill="#64748b">Failing leads loop through "copywriter" up to 2× before being flagged — no unchecked email is ever sent.</text>

  <!-- legend -->
  <rect x="330" y="686" width="14" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="350" y="697" font-size="11" fill="#334155">Gemini node</text>
  <rect x="450" y="686" width="14" height="14" rx="3" fill="#fefce8" stroke="#eab308"/>
  <text x="470" y="697" font-size="11" fill="#334155">Groq node</text>
  <rect x="560" y="686" width="14" height="14" rx="3" fill="#fdf2f8" stroke="#db2777"/>
  <text x="580" y="697" font-size="11" fill="#334155">Routing / control node</text>
</svg>
